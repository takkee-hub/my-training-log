<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health & Training Log</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased selection:bg-red-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 初期データ
    const DEFAULT_CATEGORIES = {
      '胸': ['腕立て', 'ディップス', 'ベンチプレス'],
      '背中': ['ワンハンドロー', 'ダンベルプルオーバー', 'ウンテイ'],
      '脚': ['ブルガリアンスクワット', 'モモ上げ', 'カーフ']
    };

    function App() {
      const [tab, setTab] = useState('training');

      // 部位と種目のマスタデータ（LocalStorage保存）
      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('app_categories');
        return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
      });

      // 選択状態
      const [selectedCategory, setSelectedCategory] = useState(Object.keys(categories)[0] || '胸');
      const [selectedExercise, setSelectedExercise] = useState('');

      // 新規追加用モーダル/入力フォームの状態
      const [showAddModal, setShowAddModal] = useState(false);
      const [newCategoryName, setNewCategoryName] = useState('');
      const [newExerciseName, setNewExerciseName] = useState('');
      const [targetCategoryForNewEx, setTargetCategoryForNewEx] = useState(Object.keys(categories)[0] || '胸');

      // カテゴリ変更時に種目初期化
      useEffect(() => {
        if (categories[selectedCategory] && categories[selectedCategory].length > 0) {
          setSelectedExercise(categories[selectedCategory][0]);
        } else {
          setSelectedExercise('');
        }
      }, [selectedCategory, categories]);

      // カテゴリ・種目の保存
      useEffect(() => {
        localStorage.setItem('app_categories', JSON.stringify(categories));
      }, [categories]);

      // 新しい部位を追加
      const handleAddCategory = () => {
        if (!newCategoryName.trim()) return;
        if (!categories[newCategoryName]) {
          setCategories(prev => ({ ...prev, [newCategoryName]: [] }));
          setSelectedCategory(newCategoryName);
        }
        setNewCategoryName('');
      };

      // 新しい種目を追加
      const handleAddExercise = () => {
        if (!newExerciseName.trim()) return;
        setCategories(prev => {
          const currentList = prev[targetCategoryForNewEx] || [];
          if (currentList.includes(newExerciseName)) return prev;
          return {
            ...prev,
            [targetCategoryForNewEx]: [...currentList, newExerciseName]
          };
        });
        setSelectedCategory(targetCategoryForNewEx);
        setSelectedExercise(newExerciseName);
        setNewExerciseName('');
        setShowAddModal(false);
      };

      return (
        <div class="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col justify-between shadow-lg pb-20 relative">
          {/* ヘッダー */}
          <header class="bg-red-600 text-white p-4 font-bold text-lg text-center sticky top-0 z-10 shadow flex justify-between items-center">
            <button class="text-sm bg-red-700 px-3 py-1 rounded">Back</button>
            <span>
              {tab === 'home' && '🏠 ホーム'}
              {tab === 'training' && (selectedExercise || '種目を選択')}
              {tab === 'health' && '🩺 健康データ'}
              {tab === 'analysis' && '📊 分析'}
              {tab === 'ai' && '🤖 AI相談'}
            </span>
            <span class="text-xs border px-1 rounded">kg / lbs</span>
          </header>

          {/* メインエリア */}
          <main class="p-4 flex-1">
            {/* 🏋️ トレーニングタブ */}
            {tab === 'training' && (
              <div class="space-y-4">
                {/* 部位・種目追加ボタン */}
                <div class="flex justify-between items-center">
                  <span class="font-bold text-sm text-gray-700">部位・種目の選択</span>
                  <button 
                    onClick={() => setShowAddModal(true)}
                    class="text-xs bg-red-600 text-white px-3 py-1.5 rounded-full font-bold shadow hover:bg-red-700"
                  >
                    ＋ 部位・種目を追加
                  </button>
                </div>

                {/* 部位選択タブ */}
                <div class="flex gap-2 overflow-x-auto pb-1">
                  {Object.keys(categories).map(cat => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      class={`px-4 py-1.5 text-xs font-bold rounded-full whitespace-nowrap border ${selectedCategory === cat ? 'bg-red-600 text-white border-red-600' : 'bg-white text-gray-700 border-gray-300'}`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                {/* 種目選択ドロップダウン */}
                <div>
                  <label class="block text-xs font-bold text-gray-500 mb-1">種目</label>
                  <select 
                    value={selectedExercise} 
                    onChange={(e) => setSelectedExercise(e.target.value)}
                    class="w-full p-2.5 bg-white border border-gray-300 rounded-lg text-sm font-bold"
                  >
                    {(categories[selectedCategory] || []).map(ex => (
                      <option key={ex} value={ex}>{ex}</option>
                    ))}
                  </select>
                </div>

                {/* 前回記録プレビュー */}
                <div class="bg-gray-200/60 p-3 rounded-xl text-xs space-y-1">
                  <div class="text-gray-600 font-bold flex justify-between">
                    <span>Last Record : 2026/09/16</span>
                    <span class="text-blue-600">履歴</span>
                  </div>
                  <div class="text-gray-500 pl-2">
                    <p>1セット: 20 reps</p>
                    <p>2セット: 20 reps</p>
                  </div>
                </div>

                {/* セット入力フォーム */}
                {[1, 2, 3].map(setNum => (
                  <div key={setNum} class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm space-y-2">
                    <div class="flex items-center justify-between text-sm font-bold">
                      <span class="bg-red-100 text-red-600 w-6 h-6 rounded-full flex items-center justify-center text-xs">{setNum}</span>
                      <div class="flex items-center gap-2">
                        <input type="number" placeholder="重さ" class="w-20 p-1.5 border rounded text-center text-sm" />
                        <span class="text-xs text-gray-500">kg</span>
                        <input type="number" placeholder="回数" class="w-20 p-1.5 border rounded text-center text-sm" />
                        <span class="text-xs text-gray-500">回</span>
                      </div>
                    </div>
                    <input type="text" placeholder="メモ" class="w-full p-1.5 border rounded text-xs bg-gray-50" />
                  </div>
                ))}

                <button class="w-full py-3 bg-red-600 text-white font-bold rounded-xl shadow-md">記録を保存</button>
              </div>
            )}

            {/* 🏠 ホーム */}
            {tab === 'home' && (
              <div class="space-y-4">
                <div class="p-4 bg-white rounded-xl border shadow-sm">
                  <h2 class="text-xs font-bold text-gray-500 mb-1">直近の体組成</h2>
                  <p class="text-2xl font-bold text-gray-800">68.0 <span class="text-sm font-normal">kg</span> / 18.5 <span class="text-sm font-normal">%</span></p>
                </div>
                <button onClick={() => setTab('training')} class="w-full py-3 bg-red-600 text-white font-bold rounded-xl shadow">
                  今日のトレーニングを入力する
                </button>
              </div>
            )}

            {/* 🩺 健康データ */}
            {tab === 'health' && (
              <div class="space-y-3 text-sm bg-white p-4 rounded-xl border">
                <h2 class="font-bold border-b pb-2 text-red-600">糖尿病・健康データ管理</h2>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="text-xs font-bold text-gray-600">血糖値 (mg/dL)</label>
                    <input type="number" class="w-full p-2 border rounded mt-1" placeholder="110" />
                  </div>
                  <div>
                    <label class="text-xs font-bold text-gray-600">HbA1c (%)</label>
                    <input type="number" step="0.1" class="w-full p-2 border rounded mt-1" placeholder="6.5" />
                  </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="text-xs font-bold text-gray-600">体重 (kg)</label>
                    <input type="number" step="0.1" class="w-full p-2 border rounded mt-1" placeholder="68.0" />
                  </div>
                  <div>
                    <label class="text-xs font-bold text-gray-600">体脂肪率 (%)</label>
                    <input type="number" step="0.1" class="w-full p-2 border rounded mt-1" placeholder="18.5" />
                  </div>
                </div>
                <button class="w-full py-2.5 bg-red-600 text-white font-bold rounded-lg shadow mt-2">健康データを登録</button>
              </div>
            )}

            {/* 📊 分析 */}
            {tab === 'analysis' && (
              <div class="p-4 bg-white rounded-xl border text-center text-gray-500 text-sm">
                トレーニング重量・血糖値の推移グラフエリア
              </div>
            )}

            {/* 🤖 AI相談 */}
            {tab === 'ai' && (
              <div class="p-4 bg-white rounded-xl border text-center text-gray-500 text-sm">
                Gemini AI接続エリア（開発中）
              </div>
            )}
          </main>

          {/* 追加モーダル（ポップアップ画面） */}
          {showAddModal && (
            <div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-xl">
                <h3 class="font-bold text-base border-b pb-2 text-gray-800">部位・種目の追加</h3>
                
                {/* 1. 部位自体の追加 */}
                <div class="space-y-2">
                  <label class="text-xs font-bold text-gray-600">① 新しい部位を追加</label>
                  <div class="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="例: 肩, 腕, 腹" 
                      value={newCategoryName} 
                      onChange={(e) => setNewCategoryName(e.target.value)}
                      class="flex-1 p-2 border rounded text-xs"
                    />
                    <button onClick={handleAddCategory} class="bg-gray-800 text-white px-3 py-1.5 rounded text-xs font-bold">追加</button>
                  </div>
                </div>

                <hr />

                {/* 2. 種目の追加 */}
                <div class="space-y-2">
                  <label class="text-xs font-bold text-gray-600">② 新しい種目を追加</label>
                  <select 
                    value={targetCategoryForNewEx} 
                    onChange={(e) => setTargetCategoryForNewEx(e.target.value)}
                    class="w-full p-2 border rounded text-xs bg-gray-50"
                  >
                    {Object.keys(categories).map(cat => (
                      <option key={cat} value={cat}>{cat}</option>
                    ))}
                  </select>
                  <input 
                    type="text" 
                    placeholder="例: サイドレイズ" 
                    value={newExerciseName} 
                    onChange={(e) => setNewExerciseName(e.target.value)}
                    class="w-full p-2 border rounded text-xs"
                  />
                  <button onClick={handleAddExercise} class="w-full bg-red-600 text-white py-2 rounded text-xs font-bold">種目を追加して閉じる</button>
                </div>

                <button onClick={() => setShowAddModal(false)} class="w-full text-center text-xs text-gray-400 font-bold pt-2">
                  キャンセル
                </button>
              </div>
            </div>
          )}

          {/* 下部ナビゲーション */}
          <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around p-2 text-xs text-gray-600 z-10">
            <button onClick={() => setTab('home')} class={`flex flex-col items-center ${tab === 'home' ? 'text-red-600 font-bold' : ''}`}>
              <span>🏠</span>ホーム
            </button>
            <button onClick={() => setTab('training')} class={`flex flex-col items-center ${tab === 'training' ? 'text-red-600 font-bold' : ''}`}>
              <span>🏋️</span>筋トレ
            </button>
            <button onClick={() => setTab('health')} class={`flex flex-col items-center ${tab === 'health' ? 'text-red-600 font-bold' : ''}`}>
              <span>🩺</span>健康
            </button>
            <button onClick={() => setTab('analysis')} class={`flex flex-col items-center ${tab === 'analysis' ? 'text-red-600 font-bold' : ''}`}>
              <span>📊</span>分析
            </button>
            <button onClick={() => setTab('ai')} class={`flex flex-col items-center ${tab === 'ai' ? 'text-red-600 font-bold' : ''}`}>
              <span>🤖</span>AI相談
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
