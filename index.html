<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#dc2626">

  <title>Health & Training Log</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="antialiased selection:bg-red-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">

    const { useState, useEffect } = React;

    // =========================================================
    // Google Apps Script Web App URL
    // =========================================================

    const GAS_WEBAPP_URL =
      "https://script.google.com/macros/s/AKfycbxolxpP8zH9hfJLIy514aTN4ePHnxQRxLI_t6KMTBO_dJpbJ46EwifIGqX7VJeOBWde6w/exec";


    // =========================================================
    // 初期カテゴリー
    // =========================================================

    const DEFAULT_CATEGORIES = {
      "胸": ["腕立て", "ディップス", "ベンチプレス"],
      "背中": ["ワンハンドロー", "ダンベルプルオーバー", "懸垂"],
      "脚": ["スクワット", "ブルガリアンスクワット", "カーフ"]
    };


    // =========================================================
    // 日本時間の日付
    // =========================================================

    const getJapanDate = () => {
      const now = new Date();

      const japanTime = new Date(
        now.toLocaleString("en-US", {
          timeZone: "Asia/Tokyo"
        })
      );

      const y = japanTime.getFullYear();
      const m = String(japanTime.getMonth() + 1).padStart(2, "0");
      const d = String(japanTime.getDate()).padStart(2, "0");

      return `${y}-${m}-${d}`;
    };


    // =========================================================
    // App
    // =========================================================

    function App() {

      const [tab, setTab] = useState("home");

      const [isSending, setIsSending] = useState(false);
      const [sendSuccessMessage, setSendSuccessMessage] = useState("");


      // =======================================================
      // テーマ
      // =======================================================

      const [isDarkMode, setIsDarkMode] = useState(() => {

        const savedTheme = localStorage.getItem("app_theme");

        if (savedTheme) {
          return savedTheme === "dark";
        }

        const hour = new Date().getHours();

        return hour >= 18 || hour < 6;
      });


      const toggleTheme = () => {

        setIsDarkMode(prev => {

          const next = !prev;

          localStorage.setItem(
            "app_theme",
            next ? "dark" : "light"
          );

          return next;
        });

      };


      // =======================================================
      // 部位・種目
      // =======================================================

      const [categories, setCategories] = useState(() => {

        const saved =
          localStorage.getItem("app_categories");

        return saved
          ? JSON.parse(saved)
          : DEFAULT_CATEGORIES;
      });


      const [selectedCategory, setSelectedCategory] =
        useState(
          Object.keys(categories)[0] || ""
        );


      const [selectedExercise, setSelectedExercise] =
        useState("");


      // =======================================================
      // 筋トレ入力
      // =======================================================

      const emptySets = [
        { weight: "", reps: "", memo: "" },
        { weight: "", reps: "", memo: "" },
        { weight: "", reps: "", memo: "" }
      ];


      const [setsData, setSetsData] =
        useState(emptySets);


      // =======================================================
      // 健康データ
      // =======================================================

      const initialHealthForm = {
        testDate: getJapanDate(),

        glucose: "",
        hba1c: "",

        totalChol: "",
        hdl: "",
        ldl: "",
        triglycerides: "",

        weight: "",
        fat: "",

        timing: "食後2時間",

        memo: ""
      };


      const [healthForm, setHealthForm] =
        useState(initialHealthForm);


      // =======================================================
      // 履歴
      // =======================================================

      const [allLogs, setAllLogs] =
        useState(() => {

          const savedLogs =
            localStorage.getItem(
              "app_logs_history"
            );

          return savedLogs
            ? JSON.parse(savedLogs)
            : [];
        });


      const [selectedHistoryDate,
        setSelectedHistoryDate] =
        useState(getJapanDate());


      // =======================================================
      // 管理モーダル
      // =======================================================

      const [showManageModal,
        setShowManageModal] =
        useState(false);


      const [newCategoryName,
        setNewCategoryName] =
        useState("");


      const [newExerciseName,
        setNewExerciseName] =
        useState("");


      const [targetCategoryForNewEx,
        setTargetCategoryForNewEx] =
        useState(
          Object.keys(categories)[0] || ""
        );


      // =======================================================
      // 種目変更時
      // =======================================================

      useEffect(() => {

        if (
          categories[selectedCategory] &&
          categories[selectedCategory].length > 0
        ) {

          setSelectedExercise(
            categories[selectedCategory][0]
          );

        } else {

          setSelectedExercise("");

        }

      }, [selectedCategory, categories]);


      // =======================================================
      // LocalStorage
      // =======================================================

      useEffect(() => {

        localStorage.setItem(
          "app_categories",
          JSON.stringify(categories)
        );

      }, [categories]);


      useEffect(() => {

        localStorage.setItem(
          "app_logs_history",
          JSON.stringify(allLogs)
        );

      }, [allLogs]);


      // =======================================================
      // ログ保存
      // =======================================================

      const saveLogItem = async (logItem) => {

        setAllLogs(prev => [
          logItem,
          ...prev
        ]);


        setIsSending(true);


        try {

          await fetch(
            GAS_WEBAPP_URL,
            {
              method: "POST",

              mode: "no-cors",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(logItem)
            }
          );

        } catch (err) {

          console.error(
            "GAS送信エラー:",
            err
          );

        } finally {

          setIsSending(false);

        }

      };


      // =======================================================
      // 保存完了表示
      // =======================================================

      const showSavedMessage = () => {

        setSendSuccessMessage(
          "保存しました！"
        );

        setTimeout(() => {

          setSendSuccessMessage("");

        }, 3000);

      };


      // =======================================================
      // 筋トレ保存
      // =======================================================

      const handleSaveTraining = async () => {

        if (!selectedExercise) {

          alert("種目を選択してください");

          return;
        }


        const todayStr = getJapanDate();

        let savedCount = 0;


        for (
          let i = 0;
          i < setsData.length;
          i++
        ) {

          const setItem = setsData[i];


          if (
            setItem.weight !== "" ||
            setItem.reps !== ""
          ) {

            const weightVal =
              setItem.weight
                ? `${setItem.weight} kg`
                : "自重";


            const logPayload = {

              datetime: todayStr,

              type: "筋トレ",

              category:
                selectedCategory,

              detail:
                `${selectedExercise} (${i + 1}セット目)`,

              val1:
                weightVal,

              val2:
                setItem.reps
                  ? `${setItem.reps} 回`
                  : "",

              memo:
                setItem.memo || ""
            };


            await saveLogItem(
              logPayload
            );


            savedCount++;

          }

        }


        if (savedCount === 0) {

          alert(
            "回数または重さを入力してください"
          );

        } else {

          showSavedMessage();

          setSetsData([
            { weight: "", reps: "", memo: "" },
            { weight: "", reps: "", memo: "" },
