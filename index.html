<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health & Training Log</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [tab, setTab] = useState('home');

      // 入力フォーム状態の例（健康データ）
      const [healthData, setHealthData] = useState({
        glucose: '',
        hba1c: '',
        weight: '',
        fat: '',
        bpSys: '',
        bpDia: '',
        pulse: '',
        ldl: '',
        hdl: '',
        tg: '',
        egfr: '',
        uAlb: '',
        meds: ''
      });

      return (
        <div class="max-w-md mx-auto min-h-screen bg-white flex flex-col justify-between shadow-lg pb-16">
          {/* ヘッダー */}
          <header class="bg-red-600 text-white p-4 font-bold text-lg text-center sticky top-0 z-10 shadow">
            {tab === 'home' && '🏠 ホーム'}
            {tab === 'training' && '🏋️ トレーニング'}
            {tab === 'health' && '🩺 健康データ管理'}
            {tab === 'analysis' && '📊 分析'}
            {tab === 'ai' && '🤖 AI相談'}
          </header>

          {/* メインコンテンツ */}
          <main class="p-4 flex-1">
            {/* 🏠 ホーム */}
            {tab === 'home' && (
              <div class="space-y-4">
                <div class="p-4 bg-red-50 rounded-xl border border-red-100">
                  <h2 class="text-sm font-semibold text-red-600 mb-1">直近の体組成</h2>
                  <p class="text-2xl font-bold">68.0 <span class="text-sm font-normal">kg</span> / 18.5 <span class="text-sm font-normal">%</span></p>
                </div>
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                  <h2 class="text-sm font-semibold text-gray-600 mb-2">前回のトレーニング</h2>
                  <p class="font-bold">胸 (腕立て・ベンチプレス)</p>
                  <p class="text-xs text-gray-500">2026/09/20実施</p>
                </div>
                <button onClick={() => setTab('training')} class="w-full py-3 bg-red-600 text-white font-bold rounded-xl shadow hover:bg-red-700">
                  今日のトレーニングを入力する
                </button>
              </div>
            )}

            {/* 🏋️ トレーニング */}
            {tab === 'training' && (
              <div class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-gray-600 mb-1">部位・種目選択</label>
                  <select class="w-full p-2 border rounded-lg bg-gray-50">
                    <option>胸 - 腕立て</option>
                    <option>胸 - ベンチプレス</option>
                    <option>脚 - スクワット</option>
                  </select>
                </div>
                
                <div class="p-3 bg-gray-100 rounded-lg text-xs text-gray-600">
                  <span class="font-bold">前回記録:</span> 2026/09/16 (20 reps × 2セット)
                </div>

                <div class="border p-3 rounded-xl space-y-2 bg-white">
                  <span class="font-bold text-sm text-red-600">セット 1</span>
                  <div class="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="重量 (kg)" class="p-2 border rounded" />
                    <input type="number" placeholder="回数 (reps)" class="p-2 border rounded" />
                  </div>
                  <input type="text" placeholder="メモ・感覚" class="w-full p-2 border rounded text-sm" />
                </div>

                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">疲労度 (1-5)</label>
                    <input type="number" min="1" max="5" placeholder="3" class="w-full p-2 border rounded" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">今日の体調</label>
                    <input type="text" placeholder="良好" class="w-full p-2 border rounded" />
                  </div>
                </div>

                <button class="w-full py-3 bg-red-600 text-white font-bold rounded-xl">記録を保存</button>
              </div>
            )}

            {/* 🩺 健康データ */}
            {tab === 'health' && (
              <div class="space-y-3 text-sm">
                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="text-xs font-bold text-gray-600">血糖値 (mg/dL)</label>
                    <input type="number" class="w-full p-2 border rounded" placeholder="110" />
                  </div>
                  <div>
                    <label class="text-xs font-bold text-gray-600">HbA1c (%)</label>
                    <input type="number" step="0.1" class="w-full p-2 border rounded" placeholder="6.5" />
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="text-xs font-bold text-gray-600">血圧 (最高/最低)</label>
                    <div class="flex gap-1">
                      <input type="number" placeholder="120" class="w-1/2 p-2 border rounded" />
                      <input type="number" placeholder="80" class="w-1/2 p-2 border rounded" />
                    </div>
                  </div>
                  <div>
                    <label class="text-xs font-bold text-gray-600">脈拍 (bpm)</label>
                    <input type="number" class="w-full p-2 border rounded" placeholder="72" />
                  </div>
                </div>

                <div class="p-3 bg-gray-50 border rounded-xl space-y-2">
                  <p class="font-bold text-xs text-gray-700">脂質・腎機能データ</p>
                  <div class="grid grid-cols-3 gap-1">
                    <input type="number" placeholder="LDL" class="p-1.5 border rounded text-xs" />
                    <input type="number" placeholder="HDL" class="p-1.5 border rounded text-xs" />
                    <input type="number" placeholder="中性脂肪" class="p-1.5 border rounded text-xs" />
                  </div>
                  <div class="grid grid-cols-2 gap-1">
                    <input type="number" placeholder="eGFR" class="p-1.5 border rounded text-xs" />
                    <input type="number" placeholder="尿アルブミン" class="p-1.5 border rounded text-xs" />
                  </div>
                </div>

                <div>
                  <label class="text-xs font-bold text-gray-600">服薬・インスリンメモ</label>
                  <textarea class="w-full p-2 border rounded text-xs" rows="2" placeholder="朝食前インスリン〇単位、夕食後処方薬服用"></textarea>
                </div>

                <button class="w-full py-3 bg-red-600 text-white font-bold rounded-xl">健康データを登録</button>
              </div>
            )}

            {/* 📊 分析 */}
            {tab === 'analysis' && (
              <div class="space-y-4">
                <div class="p-4 border rounded-xl bg-gray-50">
                  <h3 class="font-bold text-sm mb-2">🏆 種目別自己ベスト (1RM)</h3>
                  <ul class="space-y-1 text-sm">
                    <li class="flex justify-between"><span>ベンチプレス</span><span class="font-bold">85.0 kg</span></li>
                    <li class="flex justify-between"><span>スクワット</span><span class="font-bold">110.0 kg</span></li>
                  </ul>
                </div>
                <div class="p-4 border rounded-xl bg-gray-50">
                  <h3 class="font-bold text-sm mb-2">📈 健康データ推移 (直近)</h3>
                  <p class="text-xs text-gray-500">※ここにChart.js等のグラフを描画可能</p>
                  <div class="h-32 bg-gray-200 rounded flex items-center justify-center text-xs text-gray-500 mt-2">
                    [ 血糖値・HbA1cグラフ表示エリア ]
                  </div>
                </div>
              </div>
            )}

            {/* 🤖 AI相談 */}
            {tab === 'ai' && (
              <div class="space-y-3">
                <div class="p-3 bg-blue-50 text-blue-800 rounded-xl text-xs">
                  💡 血糖値やトレーニングログを踏まえたアドバイスをAIに相談できます。（API連携準備中）
                </div>
                <div class="h-64 border rounded-xl p-3 bg-gray-50 overflow-y-auto text-sm space-y-2">
                  <div class="bg-white p-2 rounded shadow-sm max-w-[80%]">こんにちは！今日の体調と血糖値はいかがですか？</div>
                </div>
                <div class="flex gap-2">
                  <input type="text" placeholder="AIに質問・相談を入力..." class="flex-1 p-2 border rounded text-sm" />
                  <button class="px-4 bg-red-600 text-white font-bold rounded-lg text-sm">送信</button>
                </div>
              </div>
            )}
          </main>

          {/* フッターナビゲーション */}
          <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around p-2 text-xs text-gray-600">
            <button onClick={() => setTab('home')} class={`flex flex-col items-center ${tab === 'home' ? 'text-red-600 font-bold' : ''}`}>
              <span>🏠</span>ホーム
            </button>
            <button onClick={() => setTab('training')} class={`flex flex-col items-center ${tab === 'training' ? 'text-red-600 font-bold' : ''}`}>
              <span>🏋️</span>筋トレ
            </button>
            <button onClick={() => setTab('health')} class={`flex flex-col items-center ${tab === 'health' ? 'text-red-600 font-bold' : ''}`}>
              <span>🩺</span>健康
            </button>
            <button onClick={() => setTab('analysis')} class={`flex flex-col items-center ${tab === 'analysis' ? 'text-red-600 font-bold' : ''}`}>
              <span>📊</span>分析
            </button>
            <button onClick={() => setTab('ai')} class={`flex flex-col items-center ${tab === 'ai' ? 'text-red-600 font-bold' : ''}`}>
              <span>🤖</span>AI相談
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
