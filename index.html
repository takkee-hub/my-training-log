<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#dc2626">

  <title>Health & Training Log</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="antialiased selection:bg-red-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">

    const { useState, useEffect } = React;


    // ============================================================
    // Google Apps Script Web App URL
    // ============================================================

    const GAS_WEBAPP_URL =
      "https://script.google.com/macros/s/AKfycbzRzH6rV4Oz3gdm-ZuT-u0DpRba23Qy7hLoS4-KoXuiLi9Das-eLKiynEOnuPF4ueSioQ/exec";


    // ============================================================
    // 初期カテゴリー
    // ============================================================

    const DEFAULT_CATEGORIES = {
      "胸": ["腕立て", "ディップス", "ベンチプレス"],
      "背中": ["ワンハンドロー", "ダンベルプルオーバー", "懸垂"],
      "脚": ["スクワット", "ブルガリアンスクワット", "カーフ"]
    };


    // ============================================================
    // 日本時間の日付
    // ============================================================

    const getJapanDate = () => {

      const now = new Date();

      const japanTime = new Date(
        now.toLocaleString("en-US", {
          timeZone: "Asia/Tokyo"
        })
      );

      const y = japanTime.getFullYear();
      const m = String(japanTime.getMonth() + 1).padStart(2, "0");
      const d = String(japanTime.getDate()).padStart(2, "0");

      return `${y}-${m}-${d}`;
    };


    // ============================================================
    // アプリ本体
    // ============================================================

    function App() {

      const [tab, setTab] = useState("home");

      const [isSending, setIsSending] = useState(false);

      const [sendSuccessMessage, setSendSuccessMessage] =
        useState("");


      // ============================================================
      // テーマ
      // ============================================================

      const [isDarkMode, setIsDarkMode] = useState(() => {

        const savedTheme =
          localStorage.getItem("app_theme");

        if (savedTheme) {
          return savedTheme === "dark";
        }

        const hour = new Date().getHours();

        return hour >= 18 || hour < 6;
      });


      const toggleTheme = () => {

        setIsDarkMode(prev => {

          const next = !prev;

          localStorage.setItem(
            "app_theme",
            next ? "dark" : "light"
          );

          return next;
        });
      };


      // ============================================================
      // 部位・種目
      // ============================================================

      const [categories, setCategories] = useState(() => {

        const saved =
          localStorage.getItem("app_categories");

        return saved
          ? JSON.parse(saved)
          : DEFAULT_CATEGORIES;
      });


      const [selectedCategory, setSelectedCategory] =
        useState(
          Object.keys(categories)[0] || ""
        );


      const [selectedExercise, setSelectedExercise] =
        useState("");


      // ============================================================
      // 筋トレ入力
      // ============================================================

      const emptySets = [
        {
          weight: "",
          reps: "",
          memo: ""
        },
        {
          weight: "",
          reps: "",
          memo: ""
        },
        {
          weight: "",
          reps: "",
          memo: ""
        }
      ];


      const [setsData, setSetsData] =
        useState(emptySets);


      // ============================================================
      // 健康データ
      // ============================================================

      const initialHealthForm = {

        testDate: getJapanDate(),

        glucose: "",

        hba1c: "",

        totalChol: "",

        hdl: "",

        ldl: "",

        triglycerides: "",

        weight: "",

        fat: "",

        timing: "食後2時間",

        memo: ""
      };


      const [healthForm, setHealthForm] =
        useState(initialHealthForm);


      // ============================================================
      // 履歴
      // ============================================================

      const [allLogs, setAllLogs] = useState(() => {

        const savedLogs =
          localStorage.getItem("app_logs_history");

        return savedLogs
          ? JSON.parse(savedLogs)
          : [];
      });


      const [selectedHistoryDate, setSelectedHistoryDate] =
        useState(getJapanDate());
// ============================================================
// 過去データ表示用
// ============================================================

const [selectedHealthDate, setSelectedHealthDate] =
  useState(null);

const [selectedTrainingDate, setSelectedTrainingDate] =
  useState(null);


// ============================================================
// 健康データが存在する日だけ取得
// ============================================================

const healthDates = [
  ...new Set(
    allLogs
      .filter(log =>
        log.datetime &&
        (
          log.type === "糖尿病" ||
          log.type === "血液検査" ||
          log.type === "体組成"
        )
      )
      .map(log =>
        String(log.datetime).slice(0, 10)
      )
  )
].sort().reverse();


// ============================================================
// 筋トレデータが存在する日だけ取得
// ============================================================

const trainingDates = [
  ...new Set(
    allLogs
      .filter(log =>
        log.datetime &&
        log.type === "筋トレ"
      )
      .map(log =>
        String(log.datetime).slice(0, 10)
      )
  )
].sort().reverse();


// ============================================================
// 選択した健康日の記録
// ============================================================

const selectedHealthLogs =
  selectedHealthDate
    ? allLogs.filter(log =>
        String(log.datetime).slice(0, 10) ===
        selectedHealthDate &&
        (
          log.type === "糖尿病" ||
          log.type === "血液検査" ||
          log.type === "体組成"
        )
      )
    : [];


// ============================================================
// 選択した筋トレ日の記録
// ============================================================

const selectedTrainingLogs =
  selectedTrainingDate
    ? allLogs.filter(log =>
        String(log.datetime).slice(0, 10) ===
        selectedTrainingDate &&
        log.type === "筋トレ"
      )
    : [];

      // ============================================================
      // 管理モーダル
      // ============================================================

      const [showManageModal, setShowManageModal] =
        useState(false);


      const [newCategoryName, setNewCategoryName] =
        useState("");


      const [newExerciseName, setNewExerciseName] =
        useState("");


      const [targetCategoryForNewEx, setTargetCategoryForNewEx] =
        useState(
          Object.keys(categories)[0] || ""
        );


      // ============================================================
      // 種目変更時
      // ============================================================

      useEffect(() => {

        if (
          categories[selectedCategory] &&
          categories[selectedCategory].length > 0
        ) {

          setSelectedExercise(
            categories[selectedCategory][0]
          );

        } else {

          setSelectedExercise("");
        }

      }, [selectedCategory, categories]);


      // ============================================================
      // LocalStorage
      // ============================================================

      useEffect(() => {

        localStorage.setItem(
          "app_categories",
          JSON.stringify(categories)
        );

      }, [categories]);


      useEffect(() => {

        localStorage.setItem(
          "app_logs_history",
          JSON.stringify(allLogs)
        );

      }, [allLogs]);


      // ============================================================
      // Googleスプレッドシートから履歴を読み込む
      // JSONP方式
      // ============================================================

      const loadLogsFromGAS = () => {

        return new Promise((resolve) => {

          const callbackName =
            "gasHistoryCallback_" +
            Date.now();


          window[callbackName] = (result) => {

            try {

              if (
                result &&
                result.status === "success" &&
                Array.isArray(result.logs)
              ) {

                setAllLogs(result.logs);

                localStorage.setItem(
                  "app_logs_history",
                  JSON.stringify(result.logs)
                );
              }

            } finally {

              delete window[callbackName];

              const oldScript =
                document.getElementById(callbackName);

              if (oldScript) {
                oldScript.remove();
              }

              resolve();
            }
          };


          const script =
            document.createElement("script");


          script.id = callbackName;


          script.src =
            GAS_WEBAPP_URL +
            "?callback=" +
            callbackName +
            "&t=" +
            Date.now();


          script.onerror = () => {

            delete window[callbackName];

            script.remove();

            resolve();
          };


          document.body.appendChild(script);

        });
      };


      // ============================================================
      // アプリ起動時にGoogleスプレッドシートから履歴取得
      // ============================================================

      useEffect(() => {

        loadLogsFromGAS();

      }, []);


      // ============================================================
      // ログ保存
      // ============================================================

      const saveLogItem = async (logItem) => {

        // まず画面上に反映
        setAllLogs(prev => [
          logItem,
          ...prev
        ]);


        setIsSending(true);


        try {

          await fetch(
            GAS_WEBAPP_URL,
            {
              method: "POST",

              mode: "no-cors",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(logItem)
            }
          );

        } catch (err) {

          console.error(
            "GAS送信エラー:",
            err
          );

        } finally {

          setIsSending(false);
        }
      };


      // ============================================================
      // 保存完了表示
      // ============================================================

      const showSavedMessage = () => {

        setSendSuccessMessage(
          "保存しました！"
        );

        setTimeout(() => {

          setSendSuccessMessage("");

        }, 3000);
      };


      // ============================================================
      // 筋トレ保存
      // ============================================================

      const handleSaveTraining = async () => {

        if (!selectedExercise) {

          alert(
            "種目を選択してください"
          );

          return;
        }


        const todayStr =
          getJapanDate();


        let savedCount = 0;


        for (
          let i = 0;
          i < setsData.length;
          i++
        ) {

          const setItem =
            setsData[i];


          if (
            setItem.weight !== "" ||
            setItem.reps !== ""
          ) {

            const weightVal =
              setItem.weight
                ? `${setItem.weight} kg`
                : "自重";


            const logPayload = {

              datetime:
                todayStr,

              type:
                "筋トレ",

              category:
                selectedCategory,

              detail:
                `${selectedExercise} (${i + 1}セット目)`,

              val1:
                weightVal,

              val2:
                setItem.reps
                  ? `${setItem.reps} 回`
                  : "",

              memo:
                setItem.memo || ""
            };


            await saveLogItem(
              logPayload
            );


            savedCount++;
          }
        }


        if (savedCount === 0) {

          alert(
            "回数または重さを入力してください"
          );

        } else {

          showSavedMessage();


          setSetsData([
            {
              weight: "",
              reps: "",
              memo: ""
            },
            {
              weight: "",
              reps: "",
              memo: ""
            },
            {
              weight: "",
              reps: "",
              memo: ""
            }
          ]);
        }
      };


      // ============================================================
      // 健康データ保存
      // ============================================================

      const handleSaveHealth = async () => {

        const datetimeStr =
          healthForm.testDate ||
          getJapanDate();


        let hasData = false;


        // 血糖値
        if (healthForm.glucose) {

          await saveLogItem({

            datetime:
              datetimeStr,

            type:
              "糖尿病",

            category:
              "血糖値",

            detail:
              healthForm.timing,

            val1:
              `${healthForm.glucose} mg/dL`,

            val2:
              "",

            memo:
              healthForm.memo
          });


          hasData = true;
        }


        // HbA1c
        if (healthForm.hba1c) {

          await saveLogItem({

            datetime:
              datetimeStr,

            type:
              "糖尿病",

            category:
              "HbA1c",

            detail:
              "血液検査",

            val1:
              `${healthForm.hba1c} %`,

            val2:
              "",

            memo:
              healthForm.memo
          });


          hasData = true;
        }


        // 脂質
        if (
          healthForm.totalChol ||
          healthForm.hdl ||
          healthForm.ldl ||
          healthForm.triglycerides
        ) {

          const lipid1 = [

            healthForm.totalChol
              ? `総コレ: ${healthForm.totalChol}`
              : "",

            healthForm.ldl
              ? `LDL: ${healthForm.ldl}`
              : "",

            healthForm.hdl
              ? `HDL: ${healthForm.hdl}`
              : ""

          ]
            .filter(Boolean)
            .join(" / ");


          const lipid2 =
            healthForm.triglycerides
              ? `中性脂肪: ${healthForm.triglycerides} mg/dL`
              : "";


          await saveLogItem({

            datetime:
              datetimeStr,

            type:
              "血液検査",

            category:
              "脂質パネル",

            detail:
              "コレステロール・中性脂肪",

            val1:
              lipid1,

            val2:
              lipid2,

            memo:
              healthForm.memo
          });


          hasData = true;
        }


        // 体組成
        if (
          healthForm.weight ||
          healthForm.fat
        ) {

          await saveLogItem({

            datetime:
              datetimeStr,

            type:
              "体組成",

            category:
              "体重・体脂肪",

            detail:
              "測定",

            val1:
              healthForm.weight
                ? `${healthForm.weight} kg`
                : "",

            val2:
              healthForm.fat
                ? `${healthForm.fat} %`
                : "",

            memo:
              healthForm.memo
          });


          hasData = true;
        }


        if (!hasData) {

          alert(
            "少なくとも1つの項目を入力してください"
          );

          return;
        }


        showSavedMessage();


        setHealthForm({

          ...initialHealthForm,

          testDate:
            getJapanDate()
        });
      };


      // ============================================================
      // 部位追加
      // ============================================================

      const handleAddCategory = () => {

        const name =
          newCategoryName.trim();


        if (!name) return;


        if (categories[name]) {

          alert(
            "その部位はすでに存在します"
          );

          return;
        }


        setCategories(prev => ({

          ...prev,

          [name]: []

        }));


        setSelectedCategory(name);

        setTargetCategoryForNewEx(name);

        setNewCategoryName("");
      };


      // ============================================================
      // 部位削除
      // ============================================================

      const handleDeleteCategory =
        (catToDelete) => {

        if (
          !confirm(
            `部位「${catToDelete}」と含まれる種目を削除しますか？`
          )
        ) return;


        setCategories(prev => {

          const updated = {
            ...prev
          };

          delete updated[catToDelete];

          return updated;
        });


        const remainingCats =
          Object.keys(categories)
            .filter(
              c => c !== catToDelete
            );


        if (
          remainingCats.length > 0
        ) {

          setSelectedCategory(
            remainingCats[0]
          );

          setTargetCategoryForNewEx(
            remainingCats[0]
          );

        } else {

          setSelectedCategory("");

          setTargetCategoryForNewEx("");
        }
      };


      // ============================================================
      // 種目追加
      // ============================================================

      const handleAddExercise = () => {

        const name =
          newExerciseName.trim();


        if (
          !name ||
          !targetCategoryForNewEx
        ) return;


        setCategories(prev => {

          const currentList =
            prev[targetCategoryForNewEx] ||
            [];


          if (
            currentList.includes(name)
          ) {

            alert(
              "その種目はすでに存在します"
            );

            return prev;
          }


          return {

            ...prev,

            [targetCategoryForNewEx]:
              [
                ...currentList,
                name
              ]
          };
        });


        setSelectedCategory(
          targetCategoryForNewEx
        );


        setSelectedExercise(name);


        setNewExerciseName("");
      };


      // ============================================================
      // 種目削除
      // ============================================================

      const handleDeleteExercise =
        (cat, exToDelete) => {

        if (
          !confirm(
            `「${exToDelete}」を削除しますか？`
          )
        ) return;


        setCategories(prev => ({

          ...prev,

          [cat]:
            (prev[cat] || [])
              .filter(
                ex => ex !== exToDelete
              )
        }));
      };


      // ============================================================
      // 履歴削除
      // ============================================================

      const handleDeleteLog =
        (indexToDelete) => {

        if (
          !confirm(
            "この記録を削除しますか？"
          )
        ) return;


        setAllLogs(prev =>
          prev.filter(
            (_, idx) =>
              idx !== indexToDelete
          )
        );
      };


      // ============================================================
      // 履歴抽出
      // ============================================================

      const filteredLogs =
        allLogs.filter(log => {

          if (!log.datetime)
            return false;


          return String(
            log.datetime
          ).includes(
            selectedHistoryDate
          );
        });


      // ============================================================
      // テーマ
      // ============================================================

      const themeClass =
        isDarkMode
          ? "bg-gray-950 text-gray-100"
          : "bg-gray-100 text-gray-800";


      const cardClass =
        isDarkMode
          ? "bg-gray-900 border-gray-800 text-white"
          : "bg-white border-gray-200 text-gray-800";


      const inputClass =
        isDarkMode
          ? "bg-gray-800 border-gray-700 text-white placeholder-gray-500"
          : "bg-white border-gray-300 text-gray-800";


      const navClass =
        isDarkMode
          ? "bg-gray-900 border-gray-800 text-gray-400"
          : "bg-white border-gray-200 text-gray-600";


      // ============================================================
      // JSX
      // ============================================================

      return (

        <div
          className={`max-w-md mx-auto min-h-screen flex flex-col pb-20 relative transition-colors duration-200 ${themeClass}`}
        >

          <header
            className="bg-red-600 text-white p-4 font-bold text-lg text-center sticky top-0 z-10 shadow flex justify-between items-center"
          >

            <span
              className="text-xs bg-red-700 px-2 py-1 rounded"
            >
              Sync Sheet
            </span>


            <span>

              {tab === "home" &&
                "🏠 ホーム"}

              {tab === "training" &&
                (
                  selectedExercise ||
                  "筋トレ"
                )}

              {tab === "health" &&
                "🩺 健康データ"}

              {tab === "history" &&
                "📅 履歴・記録"}

              {tab === "notebooklm" &&
                "🤖 NotebookLM"}

            </span>


            <button
              onClick={toggleTheme}
              className="text-sm bg-red-700 p-1.5 rounded-full"
            >
              {isDarkMode
                ? "🌙"
                : "☀️"}
            </button>

          </header>


          {sendSuccessMessage && (

            <div
              className="bg-green-600 text-white text-xs font-bold p-2 text-center sticky top-14 z-20 shadow"
            >
              {sendSuccessMessage}
            </div>

          )}


          <main className="p-4 flex-1">


            {/* ==================================================
                ホーム
            ================================================== */}

            {tab === "home" && (

              <div className="space-y-4">

                <div
                  className={`p-5 rounded-2xl border shadow-sm ${cardClass}`}
                >

                  <h2 className="text-xs font-bold text-gray-400 mb-2">
                    本日のトレーニング状況
                  </h2>


                  <p className="text-3xl font-bold text-red-500">

                    {
                      allLogs.filter(
                        l =>
                          l.datetime &&
                          String(l.datetime)
                            .includes(
                              getJapanDate()
                            ) &&
                          l.type === "筋トレ"
                      ).length
                    }

                    <span className="text-sm ml-2">
                      件の記録
                    </span>

                  </p>

                </div>


                <div className="grid grid-cols-2 gap-3">

                  <button
                    onClick={() =>
                      setTab("training")
                    }
                    className="py-4 bg-red-600 text-white font-bold rounded-xl shadow text-sm"
                  >
                    🏋️
                    <br />
                    筋トレ入力
                  </button>


                  <button
                    onClick={() =>
                      setTab("history")
                    }
                    className="py-4 bg-gray-800 text-white font-bold rounded-xl shadow text-sm"
                  >
                    📅
                    <br />
                    日付で振り返る
                  </button>

                </div>


                <button
                  onClick={() =>
                    setTab("health")
                  }
                  className="w-full py-4 bg-blue-600 text-white font-bold rounded-xl shadow text-sm"
                >
                  🩺 健康データを入力
                </button>

              </div>
            )}


            {/* ==================================================
                筋トレ
            ================================================== */}

            {tab === "training" && (

              <div className="space-y-4">

                <div
                  className="flex justify-between items-center"
                >

                  <span className="font-bold text-sm">
                    部位・種目
                  </span>


                  <button
                    onClick={() =>
                      setShowManageModal(true)
                    }
                    className="text-xs bg-red-600 text-white px-3 py-1.5 rounded-full font-bold"
                  >
                    ⚙️ 管理
                  </button>

                </div>


                <div
                  className="flex gap-2 overflow-x-auto pb-1"
                >

                  {Object.keys(categories)
                    .map(cat => (

                    <button
                      key={cat}
                      onClick={() =>
                        setSelectedCategory(cat)
                      }
                      className={`px-4 py-2 text-xs font-bold rounded-full whitespace-nowrap border ${
                        selectedCategory === cat
                          ? "bg-red-600 text-white border-red-600"
                          : isDarkMode
                            ? "bg-gray-800 text-gray-300 border-gray-700"
                            : "bg-white text-gray-700 border-gray-300"
                      }`}
                    >
                      {cat}
                    </button>

                  ))}

                </div>


                <div>

                  <label className="block text-xs font-bold mb-1 text-gray-400">
                    種目
                  </label>


                  <select
                    value={selectedExercise}
                    onChange={e =>
                      setSelectedExercise(
                        e.target.value
                      )
                    }
                    className={`w-full p-3 border rounded-lg text-sm font-bold ${inputClass}`}
                  >

                    {(
                      categories[
                        selectedCategory
                      ] || []
                    ).map(ex => (

                      <option
                        key={ex}
                        value={ex}
                      >
                        {ex}
                      </option>

                    ))}

                  </select>

                </div>


                {setsData.map(
                  (set, idx) => (

                  <div
                    key={idx}
                    className={`p-4 rounded-xl border shadow-sm space-y-3 ${cardClass}`}
                  >

                    <div className="flex items-center justify-between">

                      <span
                        className="bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold"
                      >
                        {idx + 1}
                      </span>


                      <div className="flex items-center gap-2">

                        <input
                          type="number"
                          inputMode="decimal"
                          placeholder="自重"
                          value={set.weight}
                          onChange={e => {

                            const val =
                              e.target.value;

                            setSetsData(
                              prev =>
                                prev.map(
                                  (item, i) =>
                                    i === idx
                                      ? {
                                          ...item,
                                          weight: val
                                        }
                                      : item
                                )
                            );

                          }}
                          className={`w-20 p-2 border rounded text-center text-sm ${inputClass}`}
                        />


                        <span className="text-xs text-gray-400">
